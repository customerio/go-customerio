name: Release

# Each export from the private repo lands on main. semantic-release reads the
# conventional commit subjects since the last tag, tags the next v3 version,
# writes CHANGELOG.md, and creates the GitHub release. feat is a minor, fix and
# perf are a patch, and other types make no release. See .releaserc.json.
on:
  # Runs after CI passes on main, so a commit that breaks CI never releases.
  # Must match the name in main.yml. The release commit has [skip ci], so it
  # starts no CI run and no second release.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the next version and notes without releasing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in a step's if, so the steps test this copy. When the
      # secret isn't set, the Slack steps are skipped and the release is unaffected.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_SERVER_SDK_RELEASES_WEBHOOK_URL }}
    steps:
      # The App token must be the one checkout persists, since the release commit
      # pushes past main's protection through the App's bypass.
      - name: Generate App installation token
        id: generate_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIO_APP_SECRET }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      # Release only the commit CI just passed. If main has moved on, that newer
      # commit's own CI run releases it.
      - name: Check main is the commit CI passed
        id: current
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$CI_SHA" ] && [ "$(git rev-parse HEAD)" != "$CI_SHA" ]; then
            echo "Main moved past $CI_SHA, so its own CI run will release it."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release with semantic-release
        id: semantic-release
        if: steps.current.outputs.release == 'true'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # Pinned to match the mobile SDKs. Bump deliberately.
          semantic_version: 25.0.5
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/github@12.0.9
            @semantic-release/exec@7.1.0
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      # Dry runs also report a next version, so they are left out.
      - name: Notify team of release
        if: >-
          env.SLACK_WEBHOOK_URL != '' &&
          steps.semantic-release.outputs.new_release_published == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.0.0-rc.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Go SDK v${{ steps.semantic-release.outputs.new_release_version }} released",
              "username": "Go SDK release bot",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Go* SDK v${{ steps.semantic-release.outputs.new_release_version }} released"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{ github.repository }}/releases/tag/v${{ steps.semantic-release.outputs.new_release_version }}|View the release>"
                  }
                }
              ]
            }

      - name: Notify team of failure
        if: >-
          failure() &&
          env.SLACK_WEBHOOK_URL != '' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.0.0-rc.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Go SDK release failure",
              "username": "Go SDK release bot",
              "channel": "#server-sdk-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Go* SDK release :warning: failure :warning:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "View the <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|run logs> to see why."
                  }
                }
              ]
            }
